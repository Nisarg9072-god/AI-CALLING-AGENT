[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-calling-agent"
version = "2.0.0"
description = "Genuinely agentic AI calling agent with Observe→Decide→Act loop"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Core
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",

    # LLM — Mistral AI (primary, cost-efficient)
    "mistralai>=1.0.0",

    # FastAPI backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",

    # Database — SQLite
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # Telephony — Twilio (optional, isolated behind abstraction)
    "twilio>=9.0.0",

    # Voice — STT (faster-whisper) and TTS (piper-tts)
    # NOTE: faster-whisper and piper-tts require separate installation
    # See docs/voice.md for setup instructions.

    # Observability
    "rich>=13.7.0",
    "structlog>=24.1.0",

    # Utilities
    "tenacity>=8.3.0",
    "ulid-py>=1.1.0",
    "typer>=0.12.0",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",   # for FastAPI TestClient
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

voice = [
    # Local STT — requires: pip install faster-whisper
    # faster-whisper>=1.0.0

    # Local TTS — requires: pip install piper-tts
    # piper-tts>=1.2.0
]

[project.scripts]
agent-cli = "cli.simulator:main"
agent-server = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*", "evals*", "tests*"]

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

# ── Ruff (linter) ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

# ── MyPy (type checker) ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
